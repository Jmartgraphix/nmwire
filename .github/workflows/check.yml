name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile the app
        run: find app -name '*.py' -exec python -m py_compile {} +
      - name: Shellcheck the launcher
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck nmwire
